[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crossfire"
version = "0.1.0"
description = "Invariant Claim Mining and Collision Detection Core"
authors = [{ name = "CROSSFIRE Core Team" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
